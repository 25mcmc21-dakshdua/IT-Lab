<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Global Indian</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="form-card">
        <!-- Simple Tricolor Bar -->
        <div class="tricolor-bar">
            <span></span><span></span><span></span>
        </div>
        
        <div class="p-4">
            <div class="text-center mb-4">
                <i class="fas fa-circle text-warning me-1"></i>
                <i class="fas fa-circle text-white border"></i>
                <i class="fas fa-circle text-success ms-1"></i>
                <h5 class="mt-3">Global Indian Registration</h5>
                <p class="text-muted small">Create your account</p>
            </div>
            
            <form id="dynamicForm" novalidate></form>
            
            <div id="successMessage" class="alert alert-success mt-3 d-none">
                <i class="fas fa-check-circle me-2"></i> Registration successful!
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="script.js"></script>

</body>
</html>
